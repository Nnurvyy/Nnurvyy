# ============================================================
# Generate Snake — animasi ular yang "memakan" heatmap commit.
# Workflow ini men-generate SVG dari contribution graph kamu
# lalu menyimpannya ke branch `output`, yang kemudian dibaca
# oleh README.md.
#
# Cara pakai:
# 1. Push repo ini ke GitHub (repo profil: Nnurvyy/Nnurvyy)
# 2. Buka tab Actions → pilih "Generate Snake" → Run workflow
# 3. Setelah selesai, animasi otomatis tampil di README
#    (selanjutnya di-refresh otomatis setiap hari)
# ============================================================
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # refresh otomatis setiap hari jam 00:00 UTC
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
